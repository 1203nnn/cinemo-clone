<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemo - profile</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header class="header">
      <a href="#" class="header-logo">CINEMO</a>
    </header>
    <main>
      <div class="profile-eyebrow">YOUR OWN SCENE</div>
      <h1 class="profile-title">누구의 시간인가요?</h1>
      <p class="profile-description">함께 보는 이야기, 취향은 각자의 방식으로.</p>
      <section class="profile-options">
        <div class="profile-card">
          <img src="./assets/images/profile-b.webp" alt="Profile 1" />
          <p class="profile-english">Y</p>
          <div>
            <h2 class="profile-name">욜로</h2>
            <p class="profile-bio">나만의 영화 노트</p>
          </div>
        </div>
        <div class="profile-card">
          <img src="./assets/images/profile-y.webp" alt="Profile 2" />
          <p class="profile-english">J</p>
          <div>
            <h2 class="profile-name">지호</h2>
            <p class="profile-bio">새로운 장면을 찾아서 </p>
          </div>
        </div>
        <div class="profile-card">
          <img src="./assets/images/profile-p.webp" alt="Profile 3" />
          <p class="profile-english">M</p>
          <div>
            <h2 class="profile-name">민</h2>
            <p class="profile-bio">오늘도 한 편</p>
          </div>
        </div>
        <div class="profile-card">
          <img src="./assets/images/profile-g.webp" alt="Profile 4" />
          <p class="profile-english">G</p>
          <div>
            <h2 class="profile-name">게스트</h2>
            <p class="profile-bio">가볍게 둘러보기 </p>
          </div>
        </div>
        <button class="">
          <img src="./assets/pencil icon.svg" /> 
          <span class="profile-label">프로필 관리</span>
        </button> 
      </section>
    </main>
    <footer>
      <p class="profile-footer">당신의 다음 장면을 만나는 곳, CINEMO</p>
    </footer>
  </body>
</html>
